  detail: >-
    TU Darmstadt operates no public developer portal and publishes no OpenAPI,
    llms.txt, .well-known/apis.json or security.txt — all four were probed and
    all four 404. It is nonetheless not a thin profile: three institution-operated,
    machine-readable surfaces were verified live on tu-darmstadt.de hosts — the
    TUdatalib DSpace 9.3 REST API, its OAI-PMH 2.0 interface, and a DBRepo JSON
    API — plus the HRZ's own Shibboleth SAML 2.0 identity provider metadata, which
    is the strongest institution-operated surface here and the one the June 2026
    profile missed entirely. One caveat about US, not about them: the entire
    ulb.tu-darmstadt.de repository host family returns HTTP 403 to this network's
    egress IP regardless of User-Agent. A second, independent fetch path retrieved
    the TUdatalib REST root and OAI-PMH Identify successfully, and the tuprints
    site root, which is how those are graded live. The tuprints and TUbiblio
    /cgi/oai2 EPrints endpoints returned 403 to both fetch paths and are recorded
    honestly as unverified rather than dropped or credited.
