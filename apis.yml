apis:
  - aid: technical-university-of-darmstadt:tudatalib-rest
    name: TUdatalib DSpace REST API
    x-operator: institution
    description: >-
      REST API of TUdatalib, the institutional research-data repository of TU
      Darmstadt. Verified live 2026-09-01: the API root returns HAL/JSON with
      dspaceName "TUdatalib System", dspaceVersion "DSpace 9.3" (the June 2026
      profile recorded 8.1 — the deployment has been upgraded), dspaceServer
      https://tudatalib.ulb.tu-darmstadt.de/server, and roughly 106 hypermedia
      _links covering communities, collections, items, bitstreams, discovery,
      authn and versioning. Hosted on the institution's own registrable domain.
      The contract is DSpace's, not TU Darmstadt's, so no OpenAPI is saved here;
      the deployment is the institutional fact.
    humanURL: https://www.ulb.tu-darmstadt.de/index.en.jsp
    baseURL: https://tudatalib.ulb.tu-darmstadt.de/server/api
    tags: [ Research Data, DSpace, REST, Repository, Open Access ]
    properties:
      - type: Website
        url: https://tudatalib.ulb.tu-darmstadt.de/
  - aid: technical-university-of-darmstadt:tudatalib-oai
    name: TUdatalib OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 metadata harvesting interface for TUdatalib. Verified live
      2026-09-01: Identify returns repositoryName "TUdatalib System",
      protocolVersion 2.0, adminEmail tudatalib@ulb.tu-darmstadt.de. The re3data
      registry (r3d100013029, doi:10.17616/R31NJMJP) independently declares this
      endpoint plus a second OpenAIRE-profile set at /server/oai/openairedata,
      and a REST discovery endpoint at /server/api/discover/search. This is one of
      the education regime's named domain standards and it is genuinely the
      institution's, not a vendor's.
    humanURL: https://www.re3data.org/repository/r3d100013029
    baseURL: https://tudatalib.ulb.tu-darmstadt.de/server/oai/request
    tags: [ Research Data, OAI-PMH, Metadata, Harvesting, Repository ]
    properties:
      - type: Website
        url: https://tudatalib.ulb.tu-darmstadt.de/
  - aid: technical-university-of-darmstadt:shibboleth-idp
    name: TU Darmstadt Shibboleth Identity Provider (SAML 2.0 metadata)
    x-operator: institution
    description: >-
      The university's own SAML 2.0 identity provider, operated by the
      Hochschulrechenzentrum (HRZ). Verified live 2026-09-01 (HTTP 200,
      15,371 bytes of XML): entityID https://idp.hrz.tu-darmstadt.de/idp/shibboleth,
      shibmd:Scope tu-darmstadt.de, an IDPSSODescriptor advertising SAML2
      HTTP-POST, POST-SimpleSign, HTTP-Redirect and SOAP/ECP bindings at
      login.tu-darmstadt.de, signing certificates, mdui:DisplayName in German and
      English, and technical/support contacts at hrz.tu-darmstadt.de. The same
      document is served from https://login.tu-darmstadt.de/idp/shibboleth. This
      is browser-mediated web SSO, not an API authorization server — there is no
      OAuth or OIDC token endpoint — but it is machine-readable metadata the
      institution itself authors and publishes, and it is the single strongest
      institution-operated surface in this profile.
    humanURL: https://www.hrz.tu-darmstadt.de/sso
    baseURL: https://idp.hrz.tu-darmstadt.de/idp/shibboleth
    tags: [ Identity Federation, Shibboleth, SAML, SSO, Metadata ]
    properties:
      - type: Documentation
        url: https://www.hrz.tu-darmstadt.de/sso
  - aid: technical-university-of-darmstadt:dfn-aai
    name: DFN-AAI federation membership (eduGAIN)
    x-operator: federation
    description: >-
      TU Darmstadt's identity provider is published in DFN-AAI, the German
      research-and-education identity federation run by DFN, and is reachable
      through eduGAIN by extension. Verified live 2026-09-01: the DFN-AAI MDQ
      service returns the signed EntityDescriptor for
      https://idp.hrz.tu-darmstadt.de/idp/shibboleth (HTTP 200, 22,505 bytes).
      A federation is shared by definition; the IdP behind this entry is TU
      Darmstadt's own, which is why this is recorded as a membership rather than
      discarded as a shared host.
    humanURL: https://doku.tid.dfn.de/de:aai:start
    baseURL: https://mdq.aai.dfn.de/entities/
    tags: [ Identity Federation, eduGAIN, DFN, SAML, Metadata ]
    properties:
      - type: Documentation
        url: https://doku.tid.dfn.de/de:aai:start
  - aid: technical-university-of-darmstadt:dbrepo
    name: DBRepo API (research database repository)
    x-operator: institution
    description: >-
      A DBRepo deployment run by the Universitaets- und Landesbibliothek for
      publishing and querying research databases. Hosted on the institution's own
      infrastructure — dbrepo.ulb.tu-darmstadt.de is a CNAME to
      fidbau.ulb.tu-darmstadt.de at 130.83.245.233, inside TU Darmstadt's own
      address space, not a vendor's. Verified live 2026-09-01: GET /api/v1/database
      returns 200 with a JSON array of database records, and GET /api/v1/license
      returns 200 with a licence vocabulary; the backend answers with
      application/problem+json on unknown paths. The web tier is a Nuxt SPA. DBRepo
      the software is a third-party product, so its generic OpenAPI is deliberately
      not saved under this institution — the deployment is what belongs here.
      Registered with DataCite as client hlqc.covcod.
    humanURL: https://dbrepo.ulb.tu-darmstadt.de/
    baseURL: https://dbrepo.ulb.tu-darmstadt.de/api/v1
    tags: [ Research Data, Databases, REST, Repository, DBRepo ]
    properties:
      - type: Website
        url: https://dbrepo.ulb.tu-darmstadt.de/
  - aid: technical-university-of-darmstadt:tujournals-janeway
    name: TUjournals REST API (Janeway tenancy)
    x-operator: tenant
    description: >-
      TUjournals is TU Darmstadt's open-access journal platform, publisher of
      record "Universitaets- und Landesbibliothek Darmstadt". It runs a live,
      fully anonymous JSON REST API — verified 2026-09-01, /api/ returns a
      discoverable endpoint index, /api/journals/ returns 6 journals (jcls, npl,
      kordaf, inggrid, zif, fortext) with ISSNs, /api/articles/ returns 2,181
      articles and /api/issues/ 136 issues. Operator is a TENANT relationship, not
      institution engineering: tujournals.ulb.tu-darmstadt.de is a CNAME to
      darmstadt.janewaysharedhosting.com (46.101.241.129), a hosted Janeway
      instance outside the university's network. The hostname is the institution's
      and the content is the institution's; the platform and the contract are
      Janeway's, so no spec is saved here. Registered with DataCite as client
      hlqc.eesqtr.
    humanURL: https://tujournals.ulb.tu-darmstadt.de/
    baseURL: https://tujournals.ulb.tu-darmstadt.de/api
    tags: [ Scholarly Publishing, Open Access, Journals, REST, Janeway ]
    properties:
      - type: Website
        url: https://tujournals.ulb.tu-darmstadt.de/
  - aid: technical-university-of-darmstadt:datacite-membership
    name: DataCite membership (provider HLQC)
    x-operator: registry
    description: >-
      TU Darmstadt registers DOIs through DataCite. Verified live 2026-09-01 via
      api.datacite.org/providers/hlqc: provider HLQC, "Universitaets- und
      Landesbibliothek Darmstadt", organizationType academicInstitution, memberType
      consortium_organization, country DE, website https://www.ulb.tu-darmstadt.de,
      and rorId https://ror.org/05n911h24 — TU Darmstadt's own ROR record, which is
      what ties this membership to the institution rather than to a lookalike.
      Six repository clients sit under it: TUdatalib (hlqc.znxeli), TUprints
      (hlqc.jslnah), TUjournals (hlqc.eesqtr), DBRepo (hlqc.covcod),
      NFDI4Ing-Ingest (hlqc.jckkgr) and TUdigit (tib.ulbd). DataCite's own contract
      is not saved here; the membership is the fact about TU Darmstadt.
