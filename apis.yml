description: >-
  The Technical University of Darmstadt (Technische Universitaet Darmstadt, TU
  Darmstadt) is a public technical research university in Darmstadt, Hesse,
  Germany, founded in 1877 and registered as ROR 05n911h24. It operates no
  central developer portal, publishes no OpenAPI description of its own, and
  its GitHub organization (TU-Darmstadt) is live but holds zero public
  repositories. What it does operate, and what makes this profile non-empty,
  is scholarly and identity infrastructure on its own domain: TUdatalib, the
  institutional research-data repository, runs DSpace 9.3 and exposes both a
  live HAL/JSON REST API and an OAI-PMH 2.0 interface; a DBRepo deployment at
  dbrepo.ulb.tu-darmstadt.de serves a live JSON API for research databases;
  and the Hochschulrechenzentrum (HRZ) runs the university's own Shibboleth
  SAML 2.0 identity provider, whose metadata is publicly retrievable and
  published into the German DFN-AAI federation and eduGAIN. TUbiblio and
  tuprints run on EPrints with OAI-PMH endpoints that are WAF-protected. The
  ULB is a DataCite consortium member (provider HLQC) registering DOIs for six
  repositories. TUjournals is real, machine-readable and busy, but it is a
  tenancy on Janeway shared hosting, not TU Darmstadt engineering. Every
  surface below is labelled with who actually operates it.
