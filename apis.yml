  - aid: technical-university-of-darmstadt:tubiblio-oai
    name: TUbiblio OAI-PMH (EPrints)
    x-operator: institution
    description: >-
      TUbiblio is the publication bibliography of TU Darmstadt, on the institution's
      own host (tubiblio18.ulb.tu-darmstadt.de, 130.83.152.163), running EPrints with
      an OAI-PMH 2.0 base path of /cgi/oai2. Status as of 2026-09-01: both fetch
      paths were answered with HTTP 403 — one a plain Apache Forbidden, the other a
      branded "Access Denied" bot-challenge page — so the endpoint is recorded as
      UNVERIFIED. Bot-blocked is a finding, not a gap; the entry is kept and marked
      rather than deleted or credited.
    humanURL: https://tubiblio.ulb.tu-darmstadt.de/
