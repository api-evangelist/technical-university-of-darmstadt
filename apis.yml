  - aid: technical-university-of-darmstadt:tuprints-oai
    name: tuprints OAI-PMH (EPrints)
    x-operator: institution
    description: >-
      tuprints is the open-access publication repository of TU Darmstadt, on the
      institution's own host and registered with DataCite as client hlqc.jslnah.
      It runs EPrints, whose OAI-PMH 2.0 base path is /cgi/oai2. Status as of
      2026-09-01: the repository site root is live and serves "TUprints ::
      Startseite", but the /cgi/oai2 endpoint returned HTTP 403 to two independent
      fetch paths, so the OAI interface itself is recorded as UNVERIFIED rather
      than claimed live. The 403 is a WAF/bot filter in front of the endpoint, not
      an absence — it is stated here rather than papered over.
    humanURL: https://tuprints.ulb.tu-darmstadt.de/
    baseURL: https://tuprints.ulb.tu-darmstadt.de/cgi/oai2
    tags: [ Open Access, OAI-PMH, EPrints, Metadata, Repository ]
