  contacts:
    technical: idmadmin@hrz.tu-darmstadt.de
    support: service@hrz.tu-darmstadt.de
  endpoints:
    - binding: urn:mace:shibboleth:1.0:profiles:AuthnRequest
      location: https://login.tu-darmstadt.de/idp/profile/Shibboleth/SSO
    - binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
      location: https://login.tu-darmstadt.de/idp/profile/SAML2/POST/SSO
    - binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST-SimpleSign
      location: https://login.tu-darmstadt.de/idp/profile/SAML2/POST-SimpleSign/SSO
    - binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect
      location: https://login.tu-darmstadt.de/idp/profile/SAML2/Redirect/SSO
    - binding: urn:oasis:names:tc:SAML:2.0:bindings:SOAP
      location: https://login.tu-darmstadt.de/idp/profile/SAML2/SOAP/ECP
      note: ECP profile — the one binding here usable by a non-browser client.
  notes: >-
    This is browser-mediated web SSO for humans. It is not an API authorization
    server: there is no OAuth 2.0 or OpenID Connect token endpoint published on the
