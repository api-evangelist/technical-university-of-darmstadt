surfaces:
  - surface: TUdatalib DSpace REST API
    base_url: https://tudatalib.ulb.tu-darmstadt.de/server/api
    anonymous_read: true
    scheme: >-
      Anonymous GET works for the API root and public discovery. Write and restricted
      reads use DSpace's own /server/api/authn endpoints, which chain to the
      Shibboleth IdP above.
    method: probed
  - surface: TUdatalib OAI-PMH
    base_url: https://tudatalib.ulb.tu-darmstadt.de/server/oai/request
    anonymous_read: true
    scheme: None. OAI-PMH is unauthenticated by protocol.
    method: probed
  - surface: DBRepo API v1
    base_url: https://dbrepo.ulb.tu-darmstadt.de/api/v1
    anonymous_read: true
    scheme: >-
      Public database listings and the license vocabulary return 200 anonymously.
      DBRepo's write and private paths use a Keycloak-issued bearer token; no
      registration path was found on the public surface.
    method: probed
  - surface: TUjournals (Janeway) REST API
    base_url: https://tujournals.ulb.tu-darmstadt.de/api
    anonymous_read: true
    scheme: >-
      Fully anonymous read across /api/journals/, /api/articles/ and /api/issues/.
      Note the operator is a vendor (Janeway shared hosting), not the institution.
    method: probed
not_found:
