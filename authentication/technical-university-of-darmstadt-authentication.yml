primary:
  type: saml2-shibboleth
  operator: institution
  entity_id: https://idp.hrz.tu-darmstadt.de/idp/shibboleth
  metadata_url: https://idp.hrz.tu-darmstadt.de/idp/shibboleth
  scope: tu-darmstadt.de
  federation: DFN-AAI (Deutsches Forschungsnetz), reachable via eduGAIN
